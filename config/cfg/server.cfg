// ============================================================================
//  server.cfg - main server settings. Edited on the host, copied into the
//  server on every container start. (Hostname / passwords come from .env.)
// ============================================================================

// ---- Basics ----------------------------------------------------------------
sv_cheats 0
sv_pure 0                    // 0 = allow custom content, which gun game maps often need
sv_region 255                // 255 = world; 0 US East, 1 US West, 3 Europe ...
sv_maxrate 0
sv_minrate 20000
sv_maxupdaterate 66
sv_minupdaterate 33
sv_maxcmdrate 66
sv_mincmdrate 33
sv_timeout 60
sv_allow_wait_command 0

// ---- Map rotation ----------------------------------------------------------
// mapcycle.txt is generated from ./maps unless you provide config/cfg/mapcycle.txt
mapcyclefile "mapcycle.txt"
mp_timelimit 0               // GunGame ends the map when someone wins; 0 = no time limit
mp_winlimit 0
mp_maxrounds 0

// ---- Free-for-all gun game --------------------------------------------------------
// CS:S has no FFA mode, so: everyone may shoot everyone (friendly fire on) + GunGame "FFA" "1"
// (config/cfg/gungame/css/gungame.config.txt) + the gg_ffa plugin (no team menu, auto respawn,
// spawn protection; see cfg/sourcemod/gg_ffa.cfg). Rounds never end by elimination or the timer.
// For classic team-based gun game set mp_friendlyfire 0, "FFA" "0" and sm_ggffa_enabled 0.
mp_friendlyfire 1
mp_tkpunish 0
mp_ignore_round_win_conditions 1
mp_autoteambalance 0
mp_limitteams 0
mp_freezetime 0
mp_roundtime 9
mp_c4timer 25
mp_startmoney 0
mp_playerid 0
sv_alltalk 1
mp_chattime 15
mp_forcecamera 0
mp_footsteps 1

// ---- Downloads (see SRCDS_FASTDL_URL in .env; handles map transfers to players) ----
sv_allowdownload 1
sv_allowupload 0
net_maxfilesize 64

// ---- Logging / bans ---------------------------------------------------------
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
exec banned_user.cfg
exec banned_ip.cfg

// ---- Bots (optional) --------------------------------------------------------
// bot_quota 6
// bot_quota_mode fill
// bot_difficulty 2
// bot_join_after_player 0

// ---- Values generated from .env (hostname, rcon, password, FastDL) - keep last ----
exec docker_env.cfg
