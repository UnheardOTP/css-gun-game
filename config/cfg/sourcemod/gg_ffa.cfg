// GunGame FFA helper (src/gg_ffa.sp) - edit and restart the container to apply.

// 1 = no team menu, auto team assignment, auto respawn, spawn protection.
// 0 = plugin does nothing: you get the normal CS:S team menu again.
sm_ggffa_enabled "1"

// Seconds before a dead player respawns (0 = no respawn, players wait for the round).
sm_ggffa_respawn_delay "2.0"

// Seconds of invulnerability after each spawn (0 = off).
sm_ggffa_spawn_protection "2.0"
